<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="rmsGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="rmsGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern 360 Monogram Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Orbit Ring Segment -->
    <path d="M 35 5 A 30 30 0 1 1 10 48" stroke="url(#rmsGrad1)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Secondary Orbit Ring -->
    <circle cx="35" cy="35" r="23" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.4" />
    <!-- Core Geometric Hexagon / Diamond -->
    <path d="M 35 18 L 49 26 L 49 44 L 35 52 L 21 44 L 21 26 Z" fill="url(#rmsGrad2)" opacity="0.25" stroke="url(#rmsGrad1)" stroke-width="2" />
    <!-- Dynamic 360 Node -->
    <circle cx="35" cy="5" r="4.5" fill="#00F0FF" filter="url(#glow)" />
    <!-- Center R Monogram Element -->
    <path d="M 28 27 L 28 43 M 28 27 H 37 C 40 27 42 29 42 32 C 42 35 40 37 37 37 H 28 M 35 37 L 42 43" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: RMS ADS -->
  <text x="88" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.08em">RMS</text>
  <text x="175" y="44" fill="url(#rmsGrad1)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.08em">ADS</text>

  <!-- Tagline: 360° DIGITAL MARKETING & ADVERTISING -->
  <text x="89" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="0.22em">360° DIGITAL MARKETING &amp; ADVERTISING</text>
  
  <!-- Subtle decorative node -->
  <circle cx="400" cy="40" r="3" fill="#00F0FF" opacity="0.8" />
  <circle cx="400" cy="40" r="6" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
</svg>
